<script>
const events=[
 {id:'sunday',day:'08',month:'NOV',type:'WORSHIP',title:'GIC Sunday Experience',date:'Every Sunday · Next gathering November 8',time:'9:00 AM & 11:00 AM',place:'Houston, Bronx & online',desc:'Come as you are and experience the presence of God. Join a welcoming, multicultural family for powerful worship and a life-giving message.',art:'service',att:'All campuses · Everyone welcome',cta:'Plan your visit'},
 {id:'midweek',day:'11',month:'NOV',type:'MIDWEEK',title:'Midweek Power Service',date:'Wednesday, November 11, 2026',time:'7:00 PM Houston · 7:30 PM New York',place:'Houston & New York campuses',desc:'Recharge in the middle of your week with an evening of worship and a message to strengthen, refresh, and equip you.',art:'youth',att:'90 minutes · In person',cta:'Get directions'},
 {id:'vogue',day:'16',month:'OCT',type:'WOMEN',title:"VOGUE Women's Conference",date:'Friday, October 16 – Sunday, October 18, 2026',time:'All day · Houston, Texas',place:'Grace International Church Auditorium, Houston',desc:'A powerful weekend of worship, teaching, and connection for women. Come ready to be strengthened in grace and walk boldly in your God-given purpose.',art:'women',att:'Women of Grace · Conference',cta:'View event'},
 {id:'vogue-ny',day:'02',month:'OCT',type:'WOMEN',title:"VOGUE Women's Conference · New York",date:'Friday, October 2 – Sunday, October 4, 2026',time:'All day · Bronx, New York',place:'Grace International Church Auditorium, NY',desc:'Three days of faith, fellowship, and encouragement for women in the New York community.',art:'women',att:'Registration details on website',cta:'Learn more'}
];
let page='Home', selected=events[0], searchText='', category='All', eventTab='Upcoming', saved=new Set(), filterOpen=false, toastTimer;
function toast(s){const o=document.getElementById('overlay');o.innerHTML=`<div class="toast">${s}</div>`;clearTimeout(toastTimer);toastTimer=setTimeout(()=>o.innerHTML='',2200)}
function go(p){page=p;render()};
function card(e){return `<article class="event-card" onclick="openEvent('${e.id}')"><div class="thumb ${e.art}"><div class="datebox"><b>${e.day}</b><small>${e.month}</small></div></div><div class="event-info"><div class="tagline">${e.type}</div><h3>${e.title}</h3><p>◷ &nbsp;${e.date}</p><p>⌖ &nbsp;${e.place}</p><div class="event-bottom"><span class="attendees">${e.att}</span><span class="price">Free</span></div></div></article>`}
function header(){return `<header class="top"><div class="brand"><div class="logo">G</div><div><b>GRACE</b><small>INTERNATIONAL CHURCH</small></div></div><button class="avatar" onclick="go('Profile')" aria-label="Profile">👋</button></header>`}
function nav(){let items=[['Home','⌂'],['Events','▦'],['Map','⌖'],['Saved','♡'],['Profile','◉']];document.getElementById('nav').innerHTML=items.map(([p,i])=>`<button class="nav-item ${page===p||page==='Details'&&p==='Events'?'active':''}" onclick="go('${p}')"><span class="ni">${i}</span>${p}</button>`).join('')}
function renderHome(){return `${header()}<div class="welcome"><div class="eyebrow">A PLACE TO BELONG</div><h1>Welcome home, Grace.</h1><p>Find your people, grow in faith, and be part of what God is doing.</p></div><div class="search"><span>⌕</span><input placeholder="Search events, ministries, campuses…" value="${searchText}" oninput="searchText=this.value;render()"><button onclick="openFilter()">☷</button></div><div class="chips">${['All','Worship','Women','Youth','Community'].map(c=>`<button class="chip ${category===c?'active':''}" onclick="category='${c}';render()">${c}</button>`).join('')}</div><div class="hero" onclick="openEvent('sunday')"><div class="hero-top"><span class="tag">✦ This Sunday · November 8</span><button class="heart" onclick="event.stopPropagation();toggleSave('sunday')">${saved.has('sunday')?'♥':'♡'}</button></div><div class="hero-content"><span class="tag">9:00 AM & 11:00 AM · ALL CAMPUSES</span><h3>GIC Sunday Experience</h3><p>Come as you are. There’s a place for you&nbsp; →</p></div></div><div class="dots"><i></i><i></i><i></i></div><div class="section-head"><h2>Coming up at GIC</h2><span class="link" onclick="go('Events')">See all&nbsp; →</span></div><div class="event-list">${filtered().slice(0,2).map(card).join('')||'<div class="empty"><div class="big">⌕</div><h3>No matches yet</h3><p>Try another search or browse all church events.</p></div>'}</div><div class="banner"><div class="bicon">▶</div><div><b>Join us live this Sunday</b><p>Worship with GIC from wherever you are</p></div><button onclick="toast('Opening GIC live stream…')">WATCH LIVE</button></div>`}
function filtered(){let q=searchText.toLowerCase();return events.filter(e=>(!q||(e.title+e.place+e.type).toLowerCase().includes(q))&&(category==='All'||e.type.toLowerCase().includes(category.toLowerCase())||category==='Community'&&e.id==='midweek'))}
function renderEvents(){return `${header()}<div class="page-heading"><div><h1>Events</h1><p>Gather, grow, and do life together.</p></div><button class="icon-btn" onclick="openFilter()">☷</button></div><div class="subnav"><button class="${eventTab==='Upcoming'?'active':''}" onclick="eventTab='Upcoming';render()">UPCOMING</button><button class="${eventTab==='Past'?'active':''}" onclick="eventTab='Past';render()">PAST EVENTS</button></div><div class="event-list">${(eventTab==='Upcoming'?events.slice(0,2):events.slice(2)).map(card).join('')||'<div class="empty"><div class="big">▦</div><h3>No past events here</h3><p>Check back after our next gathering.</p></div>'}</div>`}
function renderMap(){return `${header()}<div class="page-heading"><div><h1>Find a campus</h1><p>Grace is closer than you think.</p></div></div><div class="map"><div class="map-search">⌕ &nbsp; Search a city or campus</div><button class="pin p1" onclick="campus('Houston, Texas','15401 Bellaire Blvd · Houston, TX 77083','🗽')"><span>⛪</span></button><button class="pin p2" onclick="campus('New York','770 Barry Street · Bronx, NY 10474','🗽')"><span>⛪</span></button><button class="pin p3" onclick="campus('Lagos, Nigeria','Join GIC Lagos online','🌍')"><span>⛪</span></button><div class="map-card"><div class="campus-icon">⛪</div><div><b>Houston, Texas</b><small>15401 Bellaire Blvd · Houston, TX 77083</small></div><button class="icon-btn" onclick="toast('Opening directions…')">↗</button></div></div><div class="section-head"><h2>3 global campuses</h2><span class="link" onclick="toast('Showing all campuses')">View list</span></div><div class="event-list"><article class="event-card" onclick="campus('Houston, Texas','15401 Bellaire Blvd · Houston, TX 77083','🇺🇸')"><div class="campus-icon">🇺🇸</div><div class="event-info"><h3>Houston, Texas</h3><p>15401 Bellaire Blvd · Houston, TX 77083</p><p>Sunday services · 9:00 & 11:00 AM</p></div></article><article class="event-card" onclick="campus('New York','770 Barry Street · Bronx, NY 10474','🗽')"><div class="campus-icon">🗽</div><div class="event-info"><h3>New York</h3><p>770 Barry Street · Bronx, NY 10474</p><p>Sunday services · 10:00 AM & 1:00 PM</p></div></article><article class="event-card" onclick="campus('Lagos, Nigeria','Join GIC Lagos online','🌍')"><div class="campus-icon">🌍</div><div class="event-info"><h3>Lagos, Nigeria</h3><p>Join GIC Lagos online</p><p>Part of our global church family</p></div></article></div>`}
function campus(n,a,icon){document.querySelector('.map-card').innerHTML=`<div class="campus-icon">${icon}</div><div><b>${n}</b><small>${a}</small></div><button class="icon-btn" onclick="toast('Opening directions…')">↗</button>`}
function renderSaved(){return `${header()}<div class="page-heading"><div><h1>Saved</h1><p>Your events, all in one place.</p></div></div><div class="event-list">${events.filter(e=>saved.has(e.id)).map(card).join('')||'<div class="empty"><div class="big">♡</div><h3>Save a moment for later</h3><p>Tap the heart on any event to keep it close.</p><button class="primary" style="margin-top:16px" onclick="go(\'Events\')">EXPLORE EVENTS</button></div>'}</div>`}
function renderProfile(){return `${header()}<div class="page-heading"><div><h1>My profile</h1><p>Your GIC community.</p></div><button class="icon-btn" onclick="toast('Profile settings')">⚙</button></div><div class="profile-head"><div class="profile-pic">🙂</div><h2>Welcome, friend</h2><p>Grace International Church · Global family</p><div class="stats"><div><b>${saved.size}</b><small>Saved</small></div><div><b>3</b><small>Campuses</small></div><div><b>35+</b><small>Nations</small></div></div><button class="primary" onclick="toast('Sign in options coming soon')">SIGN IN / CREATE ACCOUNT</button></div><div class="menu"><div class="menu-row" onclick="toast('Opening sermon library…')"><span>♫</span>Sermons & teachings<span class="arrow">›</span></div><div class="menu-row" onclick="toast('Opening ministries…')"><span>✦</span>Find your ministry<span class="arrow">›</span></div><div class="menu-row" onclick="go('Map')"><span>⌖</span>Campus information<span class="arrow">›</span></div><div class="menu-row" onclick="toast('Prayer line: 281-56-GRACE (47223)')"><span>♡</span>24/7 prayer line<span class="arrow">›</span></div><div class="menu-row" onclick="toast('Opening gicglobal.org…')"><span>↗</span>Visit gicglobal.org<span class="arrow">›</span></div></div><div class="banner"><div class="bicon">💛</div><div><b>Give & make a difference</b><p>Partner with the mission across 3 continents</p></div><button onclick="toast('Opening giving…')">GIVE</button></div>`}
function renderDetails(){let e=selected;return `${header()}<div class="page-heading" style="padding-top:4px"><button class="icon-btn" onclick="go('Events')">←</button><span class="eyebrow">EVENT DETAILS</span><button class="icon-btn" onclick="toggleSave('${e.id}')">${saved.has(e.id)?'♥':'♡'}</button></div><div class="detail-hero ${e.art}"><span class="tag">${e.type}</span><button class="heart" onclick="toggleSave('${e.id}')">${saved.has(e.id)?'♥':'♡'}</button></div><div class="detail-body"><div class="eyebrow">GRACE INTERNATIONAL CHURCH</div><h1>${e.title}</h1><div style="color:#ffad3e;font-size:11px">★★★★★ <span style="color:#888ca2;font-size:9px"> A gathering for the whole GIC family</span></div><p class="desc">${e.desc}</p><div class="facts"><div class="fact"><div class="fact-icon">▦</div><div><b>${e.date}</b><small>${e.time}</small></div></div><div class="fact"><div class="fact-icon">⌖</div><div><b>${e.place}</b><small>Choose a campus or join online</small></div></div><div class="fact"><div class="fact-icon">♧</div><div><b>${e.att}</b><small>All are welcome · Free to attend</small></div></div></div><div class="host"><div class="host-avatar">⛪</div><div><b>Grace International Church</b><small>Multicultural church family · 35+ nations</small></div><span class="link" style="margin-left:auto" onclick="go('Profile')">ABOUT GIC</span></div></div><div class="bottom-cta"><div><small>Admission</small><b>Free</b></div><button class="primary" onclick="toast('${e.cta} · Visit gicglobal.org for details')">${e.cta.toUpperCase()} &nbsp; →</button></div>`}
function render(){const s=document.getElementById('screen');document.querySelector('.phone').classList.toggle('home-mode',page==='Home');s.classList.toggle('home-screen',page==='Home');s.innerHTML=page==='Home'?renderHome():page==='Events'?renderEvents():page==='Map'?renderMap():page==='Saved'?renderSaved():page==='Profile'?renderProfile():renderDetails();s.scrollTop=0;nav()}
function openEvent(id){selected=events.find(e=>e.id===id)||events[0];page='Details';render()}
function toggleSave(id){saved.has(id)?saved.delete(id):saved.add(id);render();toast(saved.has(id)?'Added to your saved events':'Removed from saved events')}
function openFilter(){document.getElementById('overlay').innerHTML=`<div class="modal-back" onclick="if(event.target===this)closeModal()"><div class="modal"><div class="modal-handle"></div><h2 class="modal-title">Filter events</h2><div class="filter-title">CATEGORY</div><div class="chips" style="padding:0;flex-wrap:wrap">${['All','Worship','Women','Youth','Community'].map(c=>`<button class="chip ${category===c?'active':''}" onclick="category='${c}';openFilter()">${c}</button>`).join('')}</div><div class="filter-title">WHEN</div><div class="range"><button class="active">Any date</button><button>This week</button><button>This month</button></div><div class="filter-title">CAMPUS</div>${['Any campus','Houston, Texas','New York','Lagos, Nigeria','Online'].map((c,i)=>`<div class="loc-option" onclick="document.querySelectorAll('.loc-option span:last-child').forEach(x=>x.textContent='');this.querySelector('span:last-child').textContent='✓'"><span>${c}</span><span>${i===0?'✓':''}</span></div>`).join('')}<div style="display:flex;gap:9px;margin-top:18px"><button class="chip" style="flex:1" onclick="category='All';closeModal()">RESET</button><button class="primary" style="flex:2" onclick="closeModal();render()">SHOW EVENTS</button></div></div></div>`}
function closeModal(){document.getElementById('overlay').innerHTML=''}
function homeSvg(n){const p={about:'<path d="M5 12 12 6l7 6v8H5z"/><path d="M10 20v-5h4v5M12 3v3"/>',locations:'<circle cx="12" cy="5" r="2"/><circle cx="5" cy="11" r="2"/><circle cx="19" cy="11" r="2"/><circle cx="8" cy="19" r="2"/><circle cx="16" cy="19" r="2"/><path d="m10.5 6.5-4 3m7-3 4 3m-10 3 1 7m7-7-1 7m-6-8h5"/>',ministries:'<rect x="4" y="5" width="15" height="15" rx="2"/><path d="M8 3v4m7-4v4M7 11h9m-7 4 2 2 4-4"/>',live:'<path d="M8 6h8a6 6 0 0 1 0 12h-3l-5 3v-3a6 6 0 0 1 0-12Z"/><rect x="9" y="9" width="5" height="6" rx="1"/><path d="m15 10 3-2v8l-3-2"/>',giving:'<path d="M12 3s-5 5-5 9a5 5 0 0 0 10 0c0-4-5-9-5-9Z"/><path d="M4 17c3-1 5 3 8 3s5-4 8-3M4 21c3-1 5 2 8 2s5-3 8-2"/>',events:'<rect x="4" y="6" width="16" height="15" rx="2"/><path d="M8 3v6m8-6v6M8 13h8m-7 4 2 2 4-4"/>',prayer:'<path d="M12 3 9 9l3 2-4 8 7-7-3-2 3-7"/><path d="M4 20c2-2 4-2 8 0s6 2 8 0"/>',volunteer:'<path d="M12 21s-8-4-8-10a4 4 0 0 1 8-1 4 4 0 0 1 8 1c0 6-8 10-8 10Z"/><path d="m7 12 3 3 7-7"/>',word:'<rect x="4" y="3" width="16" height="16" rx="1"/><path d="M8 7h8m-8 4h6m-3 8v3m-5 0h10"/>'};return `<svg viewBox="0 0 24 24" aria-hidden="true">${p[n]}</svg>`}
function renderHome(){const actions=[['about','ABOUT US',"go('Profile')"],['locations','LOCATIONS',"go('Map')"],['ministries','MINISTRIES',"toast('Explore GIC ministries')"],['live','WATCH LIVE',"toast('Opening GIC live stream…')"],['giving','GIVING',"openGiving()"],['events','UPCOMING<br>EVENTS',"go('Events')"],['prayer','PRAYER<br>REQUEST',"toast('Prayer line: 281-56-GRACE (47223)')"],['volunteer','VOLUNTEER',"toast('Find a place to serve at GIC')"],['word','WEEKLY<br>WORD',"toast('Weekly Word sign-up at gicglobal.org')"]];return `<div class="home-shell"><div class="home-tools"><button class="home-tool" onclick="toast('Settings')" aria-label="Settings">⚙</button><button class="home-tool" onclick="go('Profile')" aria-label="Profile">◎</button></div><div class="home-brand"><div class="home-mark"><svg viewBox="0 0 24 24" width="27" height="27" aria-hidden="true"><path fill="white" d="M2 13c4-1 5-6 10-6 3 0 5 2 7 2l3-3-1 6c-1 4-4 6-8 5l-4-2-4 2 2-3c-2 0-4 0-5-1Z"/><circle cx="16" cy="10" r=".8" fill="#159fe7"/></svg></div><div><b>GRACE INT’L CHURCH</b><small>Transforming Lives</small></div></div><button class="home-give" onclick="openGiving()"><span class="give-icon">♡</span> GIVE ONLINE <span class="give-arrow">↗</span></button><div class="home-grid">${actions.map(([icon,label,action])=>`<button class="home-action" onclick="${action}">${homeSvg(icon)}<span>${label}</span></button>`).join('')}</div><div class="home-social"><button class="social-action" onclick="toast('Find Grace International Church on Facebook')"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M13.5 21v-8h3l.5-3h-3.5V8c0-1 .5-1.5 1.5-1.5H17V4h-2.5C12 4 11 5.5 11 8v2H9v3h2v8"/></svg>FACEBOOK</button><button class="social-action" onclick="toast('Find Grace International Church on Instagram')"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r=".8"/></svg>INSTAGRAM</button><button class="social-action" onclick="toast('Find Grace International Church on X')"><svg viewBox="0 0 24 24"><path d="M4 4 20 20M20 4 4 20M4 4h4l12 16h-4L4 4Z"/></svg>X</button></div><div class="home-note">HOME OF TRANSFORMED VESSELS</div></div>`}
function openGiving(){window.open('https://gicglobal.org/give.html','_blank','noopener')}
render();
</script></body></html>
